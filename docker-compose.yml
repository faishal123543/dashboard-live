services:
  sqlserver:
    # Microsoft's full SQL Server 2022. On Apple Silicon it runs via
    # Rosetta emulation — enable "Use Rosetta for x86/amd64 emulation"
    # in Docker Desktop ▸ Settings ▸ General. This image includes
    # sqlcmd at /opt/mssql-tools18/bin/sqlcmd which the seed script uses.
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: loan-dashboard-mssql
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Developer"
    volumes:
      - mssql-data:/var/opt/mssql

volumes:
  mssql-data:
